<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · Entre les lignes</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/carnet-pastel.css"><link rel="stylesheet" href="css/atelier.css"><link rel="stylesheet" href="css/comptes.css"></head><body class="atelier-page"><div class="site-header"><a class="brand" href="index.html">Entre les lignes<span>.</span></a><div class="site-nav"><a href="mon-espace.html">Mon espace</a><a href="mes-livres.html">Bibliothèque</a></div></div><main class="site-main" id="contenu"><h1>Atelier du catalogue</h1><p>Gérer les livres, leur classement, les résumés et les liens de critiques.</p><p id="admin-msg" role="status">Vérification du compte…</p><section id="admin-editor" hidden><label for="book-select">Choisir un livre</label><select id="book-select"></select><form id="book-editor"><label>Titre <input name="title" required></label><label>Auteur <input name="author"></label><label>ISBN <input name="isbn"></label><label>Éditeur <input name="publisher"></label><label>Année <input name="publication_year" type="number"></label><label>Genre <input name="category" required></label><label>Sous-genre <input name="subcategory"></label><label>Présentation / résumé <textarea name="description" rows="8"></textarea></label><label>Chemin de couverture <input name="cover_path"></label><label>Chemin du PDF <input name="pdf_path"></label><label>Liens de critiques externes (un lien https:// par ligne) <textarea name="review_links" rows="4"></textarea></label><label><input name="published" type="checkbox"> Livre publié</label><button type="submit">Enregistrer le livre</button><button type="button" id="new-book">Nouveau livre</button><button type="button" id="delete-book" style="background:#fff1f2;color:#9b3455;border:1px solid #dca4b6">Supprimer ce livre</button></form><h2>Chapitres et résumés</h2><select id="chapter-select"></select><form id="chapter-form"><label>Numéro <input name="chapter_number" type="number" min="1" required></label><label>Titre <input name="title"></label><label>Résumé du chapitre <textarea name="summary" rows="6"></textarea></label><button type="submit">Enregistrer le chapitre</button><button type="button" id="new-chapter">Nouveau chapitre</button><button type="button" id="delete-chapter" style="background:#fff1f2;color:#9b3455;border:1px solid #dca4b6">Supprimer ce chapitre</button></form></section></main><script type="module" src="js/admin-catalogue.js"></script></body></html>
