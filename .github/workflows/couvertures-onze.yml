name: Créer les 11 couvertures de livres
on:
  push:
    branches: [main]
    paths:
      - 'scripts/creer_couvertures_onze.py'
      - '.github/workflows/couvertures-onze.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Générer les onze couvertures et corriger les liens
        run: python scripts/creer_couvertures_onze.py
      - name: Enregistrer les couvertures
        run: |
          git add images/couvertures/nouveaux-11/ catalogue-documente.json js/app.js ouvrage-new11-*.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Afficher onze couvertures de livres distinctes"
            git push
          fi
