<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion Firebase · Entre les lignes</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/comptes.css"><style>body{background:#fff3f7;color:#654457}main{max-width:490px;margin:7vh auto;padding:32px;background:#fff;border:1px solid #edcbd9;border-radius:26px;box-shadow:8px 8px 0 #f3dce7}h1{font-family:Georgia,serif}form{display:grid;gap:12px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d6aabd;border-radius:12px}button{cursor:pointer;background:#a75d80;color:white;border:0;border-radius:18px;padding:12px 16px}button.secondary{background:#f1d7e4;color:#703f59}button:disabled{opacity:.55}#message{min-height:2em}a{color:#8b4568}</style></head><body><main><p><a href="mon-espace.html">← Mon espace</a></p><h1>Mon compte ♡</h1><p>Connexion Firebase en préparation. Les anciens carnets restent pour l'instant associés à ton ancien compte.</p><section id="signed" hidden><p id="who"></p><button id="logout">Me déconnecter</button></section><form id="auth-form"><label>Adresse e-mail<input id="email" type="email" autocomplete="email" required></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button type="submit" id="login">Se connecter</button><button type="button" class="secondary" id="register">Créer mon compte</button><button type="button" class="secondary" id="reset">Mot de passe oublié ?</button></form><p id="message" role="status" aria-live="polite"></p><p><small>Cette connexion est indépendante de Supabase. Les données de lecture ne sont pas encore migrées vers Firebase.</small></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,sendEmailVerification,signOut} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
const config={apiKey:"AIzaSyCHrFPytJh3voKVEV1ZZdgcwTyOCl03dNY",authDomain:"lecture-entre-les-lignes.firebaseapp.com",projectId:"lecture-entre-les-lignes",storageBucket:"lecture-entre-les-lignes.firebasestorage.app",messagingSenderId:"876044393565",appId:"1:876044393565:web:da359169bccbfc709081b4"};
const auth=getAuth(initializeApp(config)), el=id=>document.getElementById(id), msg=t=>el('message').textContent=t;
const errors={'auth/operation-not-allowed':"Active Adresse e-mail/Mot de passe dans Firebase Authentication.",'auth/unauthorized-domain':"Ajoute potierbiblio-com.github.io aux domaines autorisés dans Firebase Authentication.",'auth/email-already-in-use':"Cette adresse possède déjà un compte Firebase.",'auth/invalid-credential':"Adresse e-mail ou mot de passe incorrect.",'auth/weak-password':"Choisis un mot de passe plus long.",'auth/too-many-requests':"Trop de tentatives. Réessaie plus tard."};
const run=async fn=>{msg('Un instant…');try{await fn()}catch(e){msg(errors[e.code]||'Erreur de connexion : '+(e.code||'inconnue'))}};
onAuthStateChanged(auth,u=>{if(u){const p=new URLSearchParams(location.search);const target=p.get('next');location.replace(target&&target.startsWith('/')&&!target.startsWith('//')?target:'mon-espace.html');return;}el('signed').hidden=!u;el('auth-form').hidden=!!u;el('who').textContent=u?'Connecté : '+u.email:'';if(u)msg(u.emailVerified?'Connexion Firebase réussie.':'Compte créé ou connecté. Vérifie ton adresse e-mail.');});
el('auth-form').onsubmit=e=>{e.preventDefault();run(async()=>{await signInWithEmailAndPassword(auth,el('email').value.trim(),el('password').value);msg('Connexion réussie.')})};
el('register').onclick=()=>run(async()=>{if(!el('auth-form').reportValidity())return;const r=await createUserWithEmailAndPassword(auth,el('email').value.trim(),el('password').value);await sendEmailVerification(r.user);msg('Compte créé. Vérifie ton adresse e-mail pour le confirmer.')});
el('reset').onclick=()=>run(async()=>{if(!el('email').value.trim())return msg('Indique ton adresse e-mail.');await sendPasswordResetEmail(auth,el('email').value.trim());msg('Si un compte correspond, vérifie ta boîte mail.')});
el('logout').onclick=()=>run(async()=>{await signOut(auth);msg('Déconnexion réussie.')});
</script></body></html>
